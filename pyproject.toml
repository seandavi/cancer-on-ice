[project]
name = "canceronice"
version = "0.1.0"
description = "Population cancer data as Iceberg tables"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    "xlrd>=2.0.2",
]

[project.scripts]
canceronice = "canceronice.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["slow: hits the live icegate endpoint over the network; deselected by default, run with -m slow"]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canceronice"]
