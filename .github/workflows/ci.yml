name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      # Relies entirely on the committed site/_freeze/ cache and
      # site/data/home_map.json (see site/README.md) — no network access, no
      # Python/Jupyter kernel. A page whose source changed without a local
      # re-render first will fail here rather than silently re-executing.
      - run: quarto render site
