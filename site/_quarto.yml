  page-footer:
    left: "Code: [MIT](https://github.com/seandavi/cancer-on-ice/blob/main/LICENSE). Data: each source keeps its own terms — see [Sources](/sources.qmd)."
    # Bump this string by hand alongside catalog-release below whenever the
    # site's build-time extracts (home map, dictionary, sources, recipes) are
    # refreshed against a new catalog release — there is no automated check.
    right: "Built against catalog release 2026.09."
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Start here
        href: start/index.qmd
      - text: Concepts
        href: concepts/index.qmd
      - text: Dictionary
        href: dictionary/index.qmd
      - text: Sources
        href: sources.qmd
      - text: Recipes
        href: recipes/index.qmd
    right:
      - text: "Explorer ↗"
        href: https://canceronice-explorer.seandavi.workers.dev
        target: _blank
      - icon: github
        text: "GitHub ↗"
        href: https://github.com/seandavi/cancer-on-ice
        target: _blank
  sidebar:
    - title: "Start here"
      contents:
        - start/index.qmd
        - start/python.qmd
        - start/duckdb-cli.qmd
        - start/r.qmd
        - start/sas.qmd
        - start/seerstat.qmd
    - title: "Concepts"
      contents:
