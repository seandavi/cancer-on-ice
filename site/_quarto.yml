        - recipes/suppressed-cells.qmd
        - recipes/boundary-history.qmd
        - recipes/scp-vintages.qmd
        - recipes/catchment-report.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    link-external-icon: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <!-- DuckDB-WASM's browser build imports the bare specifier "apache-arrow",
             which only resolves via an import map (see explorer/public/index.html for
             the same fix) — and an import map must be present before any module
             script on the page runs, hence this lives in <head> via include-in-header
             rather than in an {ojs} cell. See cancer-on-ice#119. -->
        <script type="importmap">
        { "imports": { "apache-arrow": "https://cdn.jsdelivr.net/npm/apache-arrow@17.0.0/+esm" } }
        </script>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">

# freeze: auto means Quarto caches each .qmd's *rendered* code output (not the
# .qmd source) under _freeze/ and commits it. A CI render with no network
# access reuses the frozen output for any page whose source hasn't changed,
# and only re-executes pages that did change (and only if the runner has
# network + the venv/kernel available). Practical effect here: commit
# _freeze/ alongside the source so `quarto render` in CI doesn't require
# hitting the live catalog, while a local `quarto render --execute-daemon
# restart` (or touching a .qmd with a code chunk) still re-runs the real
# queries. See site/README.md for the local render setup.
execute:
  freeze: auto
